{% if messages %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
    {% for message in messages %}
    <div class="mb-3 p-4 rounded-xl flex items-center justify-between text-sm shadow-sm transition-all
        {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
        {% elif message.tags == 'success' %}bg-emerald-50 text-emerald-900 border border-emerald-200
        {% elif message.tags == 'warning' %}bg-amber-50 text-amber-900 border border-amber-200
        {% else %}bg-emerald-50 text-emerald-900 border border-emerald-200{% endif %}">
        <div class="flex items-center space-x-3">
            {% if message.tags == 'error' %}
            <i class="fa-solid fa-circle-exclamation text-red-600 text-lg"></i>
            {% elif message.tags == 'success' %}
            <i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
            {% else %}
            <i class="fa-solid fa-circle-info text-emerald-700 text-lg"></i>
            {% endif %}
            <span class="font-medium">{{ message }}</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600 p-1">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
